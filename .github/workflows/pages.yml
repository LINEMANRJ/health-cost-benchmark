name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYODIDE_VERSION: "314.0.7"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Executar pipeline
        run: python -m hcb.pipeline
      - name: Cache do Pyodide
        uses: actions/cache@v4
        with:
          path: .pyodide
          key: pyodide-${{ env.PYODIDE_VERSION }}
      - name: Baixar Pyodide (Python no navegador, usado pelo chat)
        run: |
          if [ ! -f .pyodide/pyodide/pyodide-lock.json ]; then
            mkdir -p .pyodide
            curl -sSL --fail --retry 3 \
              "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-${PYODIDE_VERSION}.tar.bz2" \
              | tar -xj -C .pyodide
          fi
      - name: Gerar site estático (com chat)
        run: python scripts/build_site.py --output site --pyodide-dir .pyodide/pyodide
      - name: Testar o chat no navegador (APIs simuladas, sem custo)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/e2e_site_chat.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
