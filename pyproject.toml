[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-cost-benchmark"
version = "0.1.0"
description = "Benchmark analítico de custos e economicidade em saúde com dados abertos (SIH/SUS)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "plotly>=5.18",
  "streamlit>=1.50",
  "PyYAML>=6.0",
  "anthropic>=1.0,<2",
  "cohere>=5.13,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "matplotlib>=3.10", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[project.scripts]
hcb-pipeline = "hcb.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:cohere.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Template HTML da página do GitHub Pages: linhas longas são texto, não código.
"scripts/build_site.py" = ["E501"]
